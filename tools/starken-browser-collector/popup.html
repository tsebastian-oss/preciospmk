<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGP Starken Collector</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;width:310px;background:#f7f8fa;color:#172033}
h1{font-size:16px;margin:0 0 6px}.sub{font-size:12px;color:#667085;margin-bottom:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:5px 0}
strong{font-size:12px}.ok{color:#07883d}.err{color:#b42318}.run{color:#175cd3}
button{width:100%;border:0;border-radius:8px;padding:10px 12px;background:#0b6b37;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.foot{font-size:10px;color:#667085;margin-top:9px;line-height:1.4}
</style>
</head>
<body>
<h1>MGP · Starken Collector</h1>
<div class="sub">Cotizaciones públicas desde conexión residencial</div>
<div class="card">
  <div class="row"><span>Estado</span><strong id="status">—</strong></div>
  <div class="row"><span>Última corrida</span><strong id="last">—</strong></div>
  <div class="row"><span>Tarifas guardadas</span><strong id="accepted">—</strong></div>
  <div class="row"><span>Próxima corrida</span><strong id="next">—</strong></div>
</div>
<button id="run">Ejecutar ahora</button>
<div class="foot">Programado para martes y viernes a las 09:00. Chrome debe estar abierto; si estaba cerrado, el colector se reprograma al iniciar.</div>
<script src="popup.js"></script>
</body>
</html>
