name: Probe embedded retailer data

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[shape-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse embedded data
        run: |
          cat > /tmp/shape_probe.py <<'PY'
          import html as html_lib
          import json
          import re
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; MGPPriceMonitor/1.0)",
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "es-CL,es;q=0.9,en;q=0.7",
          }

          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=40) as response:
                  return response.read(12_000_000).decode("utf-8", "replace")

          def walk(value, path="$", depth=0):
              if depth > 30:
                  return
              yield path, value
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield from walk(item, f"{path}.{key}", depth + 1)
              elif isinstance(value, list):
                  for index, item in enumerate(value[:500]):
                      yield from walk(item, f"{path}[{index}]", depth + 1)

          def looks_product(obj):
              if not isinstance(obj, dict):
                  return False
              keys = {str(key).lower() for key in obj.keys()}
              identity = bool(keys & {"productid", "productname", "productreference", "sku", "skuid", "ean", "linktext", "name"})
              pricing = bool(keys & {"price", "listprice", "sellingprice", "offerprice", "pricerange", "sellers", "items", "offers"})
              return identity and pricing

          def compact(value, limit=2600):
              text = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              return text[:limit]

          report = ["# Embedded retailer data shapes", ""]

          # Santa Isabel
          try:
              santa_html = fetch("https://www.santaisabel.cl/")
              match = re.search(r"window\.__renderData\s*=\s*(\"(?:\\.|[^\"\\])*\")\s*;", santa_html, flags=re.S)
              if not match:
                  raise RuntimeError("window.__renderData not found")
              encoded = json.loads(match.group(1))
              santa = json.loads(encoded)
              report += ["## Santa Isabel", f"- Root keys: `{list(santa.keys())}`", ""]
              found = 0
              for path, value in walk(santa):
                  if looks_product(value):
                      report += [f"### Candidate {found + 1}: `{path}`", "```json", compact(value), "```", ""]
                      found += 1
                      if found >= 12:
                          break
              report += [f"- Product-like objects found: {found}", ""]
          except Exception as exc:
              report += ["## Santa Isabel", f"- Error: `{exc}`", ""]

          # Unimarc
          try:
              unimarc_html = fetch("https://www.unimarc.cl/")
              match = re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>', unimarc_html, flags=re.S | re.I)
              if not match:
                  raise RuntimeError("__NEXT_DATA__ not found")
              unimarc = json.loads(html_lib.unescape(match.group(1)))
              report += ["## Unimarc", f"- Root keys: `{list(unimarc.keys())}`", ""]
              found = 0
              for path, value in walk(unimarc):
                  if looks_product(value):
                      report += [f"### Candidate {found + 1}: `{path}`", "```json", compact(value), "```", ""]
                      found += 1
                      if found >= 12:
                          break
              report += [f"- Product-like objects found: {found}", ""]
          except Exception as exc:
              report += ["## Unimarc", f"- Error: `{exc}`", ""]

          text = "\n".join(report)
          with open('/tmp/hydration-shapes.md', 'w', encoding='utf-8') as file:
              file.write(text[:60000])
          PY
          python /tmp/shape_probe.py

      - name: Publish shape report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/hydration-shapes.md', 'utf8');
            const title = 'Embedded retailer data shapes';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
