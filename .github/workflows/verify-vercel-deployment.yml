name: Verify Vercel deployment

on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Discover production URL and verify dashboard
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/vercel-check
          : > /tmp/vercel-check/candidates.txt
          echo "false" > /tmp/vercel-check/verification-ok.txt

          commit_message=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$DEPLOYMENT_SHA" \
            | jq -r '.commit.message // ""')

          run_scrape=false
          if [[ "$commit_message" == *"[scrape-test]"* ]]; then
            run_scrape=true
          fi

          PUBLIC_URL=""
          candidates=(
            "$DEPLOYMENT_URL"
            "https://preciospmk.vercel.app"
            "https://preciospmk-tsebastian-oss-projects.vercel.app"
            "https://preciospmk-tsebastian-oss.vercel.app"
          )

          index=0
          for candidate in "${candidates[@]}"; do
            index=$((index + 1))
            body="/tmp/vercel-check/candidate-${index}.html"
            meta=$(curl -L --max-time 30 -sS -o "$body" -w '%{http_code}|%{url_effective}|%{content_type}' "$candidate/")
            echo "$candidate => $meta" >> /tmp/vercel-check/candidates.txt
            final_url=$(echo "$meta" | cut -d'|' -f2)
            status=$(echo "$meta" | cut -d'|' -f1)
            if [ "$status" = "200" ] \
              && [[ "$final_url" != *"vercel.com/login"* ]] \
              && grep -Eqi "MGP Price Intelligence|Resumen del mercado" "$body"; then
              PUBLIC_URL="$candidate"
              cp "$body" /tmp/vercel-check/home.html
              break
            fi
          done

          dashboard_valid=false
          products_valid=false

          if [ -n "$PUBLIC_URL" ]; then
            dashboard_meta=$(curl -L --max-time 45 -sS -o /tmp/vercel-check/dashboard.json -w '%{http_code}|%{url_effective}|%{content_type}' "$PUBLIC_URL/api/dashboard")
            products_meta=$(curl -L --max-time 45 -sS -o /tmp/vercel-check/products.json -w '%{http_code}|%{url_effective}|%{content_type}' "$PUBLIC_URL/api/products?page=1&pageSize=5&supermarket=Jumbo")

            if [ "$(echo "$dashboard_meta" | cut -d'|' -f1)" = "200" ] \
              && jq -e '.summary.total_products > 0 and (.supermarkets | length) >= 3 and (.topOffers | type == "array")' /tmp/vercel-check/dashboard.json >/dev/null 2>&1; then
              dashboard_valid=true
            fi

            if [ "$(echo "$products_meta" | cut -d'|' -f1)" = "200" ] \
              && jq -e '.total > 0 and (.products | length) > 0 and ([.products[].supermarket] | all(. == "Jumbo"))' /tmp/vercel-check/products.json >/dev/null 2>&1; then
              products_valid=true
            fi

            if [ "$run_scrape" = true ]; then
              scrape_meta=$(curl -L --max-time 75 -sS -o /tmp/vercel-check/scrape.json -w '%{http_code}|%{url_effective}|%{content_type}' "$PUBLIC_URL/api/scrape")
            else
              scrape_meta="skipped (add [scrape-test] to the commit message to run)"
              echo '{"skipped":true}' > /tmp/vercel-check/scrape.json
            fi
          else
            dashboard_meta="not-tested"
            products_meta="not-tested"
            scrape_meta="not-tested"
            echo '{"error":"No public production URL discovered"}' > /tmp/vercel-check/dashboard.json
            echo '{"error":"No public production URL discovered"}' > /tmp/vercel-check/products.json
            echo '{"error":"No public production URL discovered"}' > /tmp/vercel-check/scrape.json
          fi

          if [ -n "$PUBLIC_URL" ] && [ "$dashboard_valid" = true ] && [ "$products_valid" = true ]; then
            echo "true" > /tmp/vercel-check/verification-ok.txt
          fi

          {
            echo "# Production verification"
            echo
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Public URL: ${PUBLIC_URL:-not discovered}"
            echo "- Commit: $DEPLOYMENT_SHA"
            echo "- Commit message: $commit_message"
            echo "- Dashboard API: $dashboard_meta · valid=$dashboard_valid"
            echo "- Filtered products API: $products_meta · valid=$products_valid"
            echo "- Scrape API: $scrape_meta"
            echo
            echo "## Candidate domains"
            echo '```'
            cat /tmp/vercel-check/candidates.txt
            echo '```'
            echo
            echo "## Dashboard response"
            echo '```json'
            head -c 5000 /tmp/vercel-check/dashboard.json
            echo
            echo '```'
            echo
            echo "## Products response"
            echo '```json'
            head -c 5000 /tmp/vercel-check/products.json
            echo
            echo '```'
          } > /tmp/vercel-check/report.md

      - name: Publish verification report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/vercel-check/report.md', 'utf8');
            const title = 'Production verification';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Enforce production health
        run: |
          if [ "$(cat /tmp/vercel-check/verification-ok.txt)" != "true" ]; then
            echo "Production verification failed"
            exit 1
          fi
