name: Verify Vercel deployment

on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify homepage and APIs
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          set +e
          mkdir -p /tmp/vercel-check

          home_meta=$(curl -L --max-time 30 -sS -D /tmp/vercel-check/home.headers -o /tmp/vercel-check/home.html -w '%{http_code}|%{url_effective}|%{content_type}' "$DEPLOYMENT_URL/")
          products_meta=$(curl -L --max-time 30 -sS -D /tmp/vercel-check/products.headers -o /tmp/vercel-check/products.json -w '%{http_code}|%{url_effective}|%{content_type}' "$DEPLOYMENT_URL/api/products")
          scrape_meta=$(curl -L --max-time 75 -sS -D /tmp/vercel-check/scrape.headers -o /tmp/vercel-check/scrape.json -w '%{http_code}|%{url_effective}|%{content_type}' "$DEPLOYMENT_URL/api/scrape")

          {
            echo "# Vercel production verification"
            echo
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Commit: $DEPLOYMENT_SHA"
            echo "- Homepage: $home_meta"
            echo "- Products API: $products_meta"
            echo "- Scrape API: $scrape_meta"
            echo
            echo "## Products response"
            echo '```'
            head -c 5000 /tmp/vercel-check/products.json
            echo
            echo '```'
            echo
            echo "## Scrape response"
            echo '```'
            head -c 5000 /tmp/vercel-check/scrape.json
            echo
            echo '```'
            echo
            echo "## Redirect headers"
            echo '```'
            head -n 40 /tmp/vercel-check/home.headers
            echo '```'
          } > /tmp/vercel-check/report.md

      - name: Publish verification report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/vercel-check/report.md', 'utf8');
            const sha = context.payload.deployment?.sha?.slice(0, 7) || 'unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vercel verification ${sha}`,
              body,
              labels: []
            });
