name: Probe retailer storefront assets

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[asset-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect storefront bundles
        run: |
          cat > /tmp/probe.py <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from collections import OrderedDict

          SITES = {
              "Santa Isabel": {
                  "url": "https://www.santaisabel.cl/",
                  "tokens": ["apis.santaisabel.cl", "api.santaisabel", "product", "search", "catalog", "graphql"],
              },
              "Unimarc": {
                  "url": "https://www.unimarc.cl/",
                  "tokens": ["bff-unimarc-ecommerce.unimarc.cl", "getToken", "product", "search", "catalog", "graphql"],
              },
          }
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; MGPPriceMonitor/1.0)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*",
              "Accept-Language": "es-CL,es;q=0.9,en;q=0.7",
          }

          def fetch(url, timeout=30):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  data = response.read(6_000_000)
                  return response.status, response.headers.get_content_type(), data.decode("utf-8", "replace"), response.geturl()

          def uniq(items):
              return list(OrderedDict.fromkeys(items))

          def contexts(text, token, before=260, after=500, limit=12):
              output = []
              low = text.lower()
              needle = token.lower()
              start = 0
              while len(output) < limit:
                  pos = low.find(needle, start)
                  if pos < 0:
                      break
                  fragment = text[max(0, pos - before): min(len(text), pos + len(token) + after)]
                  fragment = re.sub(r"\s+", " ", fragment).strip()
                  output.append(fragment[:1000])
                  start = pos + len(token)
              return output

          report = ["# Retailer storefront endpoint context", ""]
          for name, config in SITES.items():
              root = config["url"]
              tokens = config["tokens"]
              report += [f"## {name}", ""]
              try:
                  status, ctype, html, final_url = fetch(root)
                  report += [f"- Homepage: {status} `{final_url}` `{ctype}`", ""]
              except Exception as exc:
                  report += [f"- Homepage fetch failed: `{exc}`", ""]
                  continue

              script_srcs = re.findall(r"<script[^>]+src=[\"']([^\"']+)[\"']", html, flags=re.I)
              scripts = uniq([urllib.parse.urljoin(final_url, src) for src in script_srcs])[:25]
              report += ["### Script URLs", "```", *scripts, "```", ""]

              html_hits = []
              for token in tokens:
                  for fragment in contexts(html, token, limit=8):
                      html_hits.append(f"HTML [{token}] {fragment}")
              report += ["### Homepage context", "```", *uniq(html_hits)[:30], "```", ""]

              bundle_hits = []
              for script_url in scripts:
                  try:
                      _, _, js, resolved = fetch(script_url, timeout=30)
                  except Exception as exc:
                      bundle_hits.append(f"FETCH_ERROR {script_url} :: {exc}")
                      continue

                  for token in tokens:
                      for fragment in contexts(js, token, limit=10):
                          bundle_hits.append(f"BUNDLE {resolved} [{token}] {fragment}")

                  if "bff-unimarc-ecommerce.unimarc.cl" in js:
                      for path in re.findall(r"[\"'`](/[^\"'`]{1,180})[\"'`]", js):
                          low = path.lower()
                          if any(word in low for word in ["product", "search", "catalog", "category", "token", "offer"]):
                              bundle_hits.append(f"PATH {resolved} {path}")

              report += ["### Bundle endpoint context", "```", *uniq(bundle_hits)[:55], "```", ""]

          text = "\n".join(report)
          with open('/tmp/asset-probe-report.md', 'w', encoding='utf-8') as file:
              file.write(text[:60000])
          PY
          python /tmp/probe.py

      - name: Publish asset probe report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/asset-probe-report.md', 'utf8');
            const title = 'Retailer storefront asset probe';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
