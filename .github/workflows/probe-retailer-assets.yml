name: Probe retailer storefront assets

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[asset-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect storefront bundles
        run: |
          cat > /tmp/probe.py <<'PY'
          import json, re, urllib.parse, urllib.request
          from collections import OrderedDict

          SITES = {
              "Santa Isabel": "https://www.santaisabel.cl/",
              "Unimarc": "https://www.unimarc.cl/",
          }
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; MGPPriceMonitor/1.0)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*",
              "Accept-Language": "es-CL,es;q=0.9,en;q=0.7",
          }

          def fetch(url, timeout=30):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read(5_000_000)
                  return r.status, r.headers.get_content_type(), data.decode("utf-8", "replace"), r.geturl()

          def uniq(items):
              return list(OrderedDict.fromkeys(items))

          report = ["# Retailer storefront asset probe", ""]
          for name, root in SITES.items():
              report += [f"## {name}", ""]
              try:
                  status, ctype, html, final_url = fetch(root)
                  report += [f"- Homepage: {status} `{final_url}` `{ctype}`", ""]
              except Exception as exc:
                  report += [f"- Homepage fetch failed: `{exc}`", ""]
                  continue

              srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
              scripts = uniq([urllib.parse.urljoin(final_url, src) for src in srcs])[:30]
              report += [f"- Script bundles discovered: {len(scripts)}", ""]

              findings = []
              hosts = []
              for script_url in scripts:
                  try:
                      s, ct, js, resolved = fetch(script_url, timeout=25)
                  except Exception as exc:
                      findings.append(f"FETCH_ERROR {script_url} :: {exc}")
                      continue

                  absolute_urls = re.findall(r'https?://[^"\'`\\\s<>]+', js)
                  for url in absolute_urls:
                      low = url.lower()
                      if any(token in low for token in ["api", "graphql", "search", "product", "catalog", "santaisabel", "unimarc"]):
                          findings.append(url[:500])
                          try:
                              hosts.append(urllib.parse.urlparse(url).netloc)
                          except Exception:
                              pass

                  for match in re.finditer(r'.{0,180}(?:apis\.santaisabel\.cl|graphql|product_search|catalog_system|search/products|products/search|/api/).{0,260}', js, flags=re.I | re.S):
                      snippet = re.sub(r'\s+', ' ', match.group(0)).strip()
                      findings.append(f"SNIPPET {resolved} :: {snippet[:700]}")

              findings = uniq(findings)[:120]
              hosts = uniq(hosts)
              report += ["### Relevant hosts", "```", *hosts[:50], "```", ""]
              report += ["### Endpoint and code findings", "```", *findings, "```", ""]

          with open('/tmp/asset-probe-report.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(report))
          PY
          python /tmp/probe.py

      - name: Publish asset probe report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/asset-probe-report.md', 'utf8');
            const title = 'Retailer storefront asset probe';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
