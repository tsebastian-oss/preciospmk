name: Probe retailer storefront assets

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[asset-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect storefront bundles
        run: |
          cat > /tmp/probe.py <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from collections import OrderedDict

          SITES = {
              "Santa Isabel": "https://www.santaisabel.cl/",
              "Unimarc": "https://www.unimarc.cl/",
          }
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; MGPPriceMonitor/1.0)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*",
              "Accept-Language": "es-CL,es;q=0.9,en;q=0.7",
          }

          def fetch(url, timeout=30):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  data = response.read(4_000_000)
                  return response.status, response.headers.get_content_type(), data.decode("utf-8", "replace"), response.geturl()

          def uniq(items):
              return list(OrderedDict.fromkeys(items))

          report = ["# Retailer storefront asset probe", ""]
          for name, root in SITES.items():
              report += [f"## {name}", ""]
              try:
                  status, ctype, html, final_url = fetch(root)
                  report += [f"- Homepage: {status} `{final_url}` `{ctype}`", ""]
              except Exception as exc:
                  report += [f"- Homepage fetch failed: `{exc}`", ""]
                  continue

              srcs = re.findall(r"<script[^>]+src=[\"']([^\"']+)[\"']", html, flags=re.I)
              scripts = uniq([urllib.parse.urljoin(final_url, src) for src in srcs])[:18]
              report += [f"- Script bundles inspected: {len(scripts)}", ""]

              findings = []
              hosts = []
              for script_url in scripts:
                  try:
                      _, _, js, resolved = fetch(script_url, timeout=25)
                  except Exception as exc:
                      findings.append(f"FETCH_ERROR {script_url} :: {exc}")
                      continue

                  for url in re.findall(r"https?://[^\"'`\\\s<>]+", js):
                      low = url.lower()
                      if any(token in low for token in ["api", "graphql", "search", "product", "catalog", "santaisabel", "unimarc"]):
                          findings.append(url[:350])
                          hosts.append(urllib.parse.urlparse(url).netloc)

                  pattern = r".{0,100}(?:apis\.santaisabel\.cl|graphql|product_search|catalog_system|search/products|products/search|/api/).{0,160}"
                  for match in re.finditer(pattern, js, flags=re.I | re.S):
                      snippet = re.sub(r"\s+", " ", match.group(0)).strip()
                      findings.append(f"SNIPPET {resolved} :: {snippet[:350]}")

              findings = uniq(findings)[:45]
              hosts = uniq(hosts)[:30]
              report += ["### Relevant hosts", "```", *hosts, "```", ""]
              report += ["### Endpoint and code findings", "```", *findings, "```", ""]

          text = "\n".join(report)
          with open('/tmp/asset-probe-report.md', 'w', encoding='utf-8') as file:
              file.write(text[:60000])
          PY
          python /tmp/probe.py

      - name: Publish asset probe report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/asset-probe-report.md', 'utf8');
            const title = 'Retailer storefront asset probe';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
