name: Enterprise foundation validation

on:
  push:
    branches:
      - feature/enterprise-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security gate
        run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run build
