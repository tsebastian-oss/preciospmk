name: Production health verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel and verify integrated health
        env:
          BASE_URL: https://preciospmk.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            health_code=$(curl --silent --show-error --max-time 20 \
              --output /tmp/health.json --write-out "%{http_code}" \
              "$BASE_URL/api/health" || true)
            root_code=$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out "%{http_code}" \
              "$BASE_URL/" || true)
            login_code=$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out "%{http_code}" \
              "$BASE_URL/login" || true)
            onboarding_code=$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out "%{http_code}" \
              "$BASE_URL/onboarding" || true)
            products_code=$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out "%{http_code}" \
              "$BASE_URL/api/products" || true)
            deployed_sha=$(jq -r '.vercel.commitSha // empty' /tmp/health.json 2>/dev/null || true)

            echo "Attempt $attempt: health=$health_code root=$root_code login=$login_code onboarding=$onboarding_code products=$products_code deployed_sha=${deployed_sha:-missing}"

            if [[ "$health_code" == "200" \
              && "$root_code" == "200" \
              && "$login_code" == "200" \
              && "$onboarding_code" =~ ^(307|308)$ \
              && "$products_code" == "401" \
              && "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              cat /tmp/health.json
              echo "Production is healthy and is serving commit $EXPECTED_SHA"
              exit 0
            fi

            sleep 10
          done

          echo "Production did not become healthy in time. Last health response:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1
