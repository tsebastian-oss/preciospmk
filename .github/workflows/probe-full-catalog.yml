name: Probe full retailer catalogs

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[catalog-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Map retailer catalog sources
        run: |
          cat > /tmp/probe.py <<'PY'
          import gzip
          import io
          import re
          import urllib.parse
          import urllib.request
          from collections import OrderedDict

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          HEADERS = {
              'User-Agent': UA,
              'Accept': 'text/html,application/xhtml+xml,application/xml,application/json,text/plain,*/*',
              'Accept-Language': 'es-CL,es;q=0.9,en;q=0.7',
          }

          def fetch(url, timeout=35, max_bytes=12_000_000):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read(max_bytes)
                  if r.headers.get('content-encoding') == 'gzip' or url.endswith('.gz'):
                      try:
                          raw = gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
                      except Exception:
                          pass
                  return r.status, r.headers, raw.decode('utf-8', 'replace'), r.geturl()

          def uniq(xs):
              return list(OrderedDict.fromkeys(xs))

          def sitemap_urls(url, depth=0, seen=None):
              if seen is None:
                  seen = set()
              if depth > 2 or url in seen:
                  return [], []
              seen.add(url)
              try:
                  _, _, body, _ = fetch(url)
              except Exception as exc:
                  return [], [f'ERROR {url}: {exc}']
              locs = re.findall(r'<loc>(.*?)</loc>', body, flags=re.I | re.S)
              locs = [re.sub(r'&amp;', '&', x.strip()) for x in locs]
              nested = [x for x in locs if x.endswith('.xml') or '.xml?' in x or x.endswith('.xml.gz')]
              pages = [x for x in locs if x not in nested]
              errors = []
              for child in nested[:100]:
                  child_pages, child_errors = sitemap_urls(child, depth + 1, seen)
                  pages.extend(child_pages)
                  errors.extend(child_errors)
              return uniq(pages), errors

          def probe_json(url):
              try:
                  status, headers, body, final = fetch(url, max_bytes=2_000_000)
                  info = f'{status} {final} {headers.get("content-type")} bytes={len(body)}'
                  return info, body[:1200].replace('\n', ' ')
              except Exception as exc:
                  return f'ERROR {exc}', ''

          report = ['# Full catalog source probe', '']
          retailers = {
              'Lider': {
                  'roots': ['https://super.lider.cl/robots.txt', 'https://super.lider.cl/sitemap.xml', 'https://super.lider.cl/sitemap_index.xml'],
                  'apis': [
                      'https://super.lider.cl/api/search?query=leche&page=1',
                      'https://super.lider.cl/api/products?limit=50',
                      'https://super.lider.cl/api/graphql',
                  ],
                  'page': 'https://super.lider.cl/v/productos-de-despensa-y-abarrotes'
              },
              'Jumbo': {
                  'roots': ['https://www.jumbo.cl/robots.txt', 'https://www.jumbo.cl/sitemap.xml', 'https://www.jumbo.cl/sitemap_index.xml'],
                  'apis': [
                      'https://www.jumbo.cl/api/catalog_system/pub/products/search?_from=0&_to=49',
                      'https://api.jumbo.cl/api/catalog_system/pub/products/search?_from=0&_to=49',
                      'https://jumbo.vtexcommercestable.com.br/api/catalog_system/pub/products/search?_from=0&_to=49',
                      'https://jumbo.vtexcommercestable.com.br/api/catalog_system/pub/category/tree/3',
                  ],
                  'page': 'https://www.jumbo.cl/despensa'
              },
              'Santa Isabel': {
                  'roots': ['https://www.santaisabel.cl/robots.txt', 'https://www.santaisabel.cl/sitemap.xml', 'https://www.santaisabel.cl/sitemap_index.xml'],
                  'apis': [
                      'https://santaisabel.vtexcommercestable.com.br/api/catalog_system/pub/products/search?_from=0&_to=49',
                      'https://santaisabel.vtexcommercestable.com.br/api/catalog_system/pub/category/tree/3',
                      'https://www.santaisabel.cl/api/catalog_system/pub/products/search?_from=0&_to=49',
                      'https://apis.santaisabel.cl/api/catalog_system/pub/products/search?_from=0&_to=49',
                  ],
                  'page': 'https://www.santaisabel.cl/'
              }
          }

          for name, cfg in retailers.items():
              report += [f'## {name}', '']
              all_pages = []
              for root in cfg['roots']:
                  pages, errors = sitemap_urls(root)
                  if pages:
                      report += [f'- Sitemap root `{root}`: **{len(pages)} URLs**']
                      all_pages.extend(pages)
                  elif errors:
                      report += [f'- Sitemap root `{root}`: `{errors[0]}`']
              all_pages = uniq(all_pages)
              product_like = [u for u in all_pages if any(t in u.lower() for t in ['/p', '/ip/', 'product', 'producto'])]
              report += [
                  f'- Unique sitemap URLs: **{len(all_pages)}**',
                  f'- Product-like sitemap URLs: **{len(product_like)}**',
                  '',
                  '### Sitemap samples',
                  '```',
                  *all_pages[:8],
                  '...',
                  *(all_pages[-5:] if all_pages else []),
                  '```',
                  ''
              ]

              report += ['### API probes', '']
              for api in cfg['apis']:
                  info, sample = probe_json(api)
                  report += [f'#### `{api}`', f'- {info}', '```', sample, '```', '']

              try:
                  status, _, html, final = fetch(cfg['page'])
                  report += [f'### Page source `{cfg["page"]}`', f'- {status} `{final}` bytes={len(html)}', '']
                  script_srcs = uniq([
                      urllib.parse.urljoin(final, x.replace('&amp;', '&'))
                      for x in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
                  ])
                  report += [f'- Script bundles: {len(script_srcs)}']
                  tokens = ['__NEXT_DATA__', '__renderData', 'totalResults', 'recordsFiltered', 'pageCount', 'pagination', 'category', 'departments', 'facets', 'productSearch', 'searchResult', 'catalog_system', 'vtex', 'offset', 'pageSize']
                  findings = []
                  for token in tokens:
                      pos = html.lower().find(token.lower())
                      if pos >= 0:
                          findings.append(f'HTML[{token}] ' + re.sub(r'\s+', ' ', html[max(0, pos - 250):pos + 650])[:900])
                  for src in script_srcs[:20]:
                      if any(x in src for x in ['maps.googleapis', 'ruxit', 'polyfills']):
                          continue
                      try:
                          _, _, js, resolved = fetch(src, max_bytes=8_000_000)
                      except Exception as exc:
                          findings.append(f'BUNDLE_ERROR {src}: {exc}')
                          continue
                      for token in ['catalog_system', 'product_search', 'productSearch', 'searchResult', 'totalResults', 'pageSize', 'offset', 'api.jumbo.cl', 'apis.santaisabel.cl', 'super.lider.cl/api', 'graphql']:
                          pos = js.lower().find(token.lower())
                          if pos >= 0:
                              findings.append(f'JS {resolved}[{token}] ' + re.sub(r'\s+', ' ', js[max(0, pos - 350):pos + 1000])[:1350])
                  report += ['### Pagination/API hints', '```', *findings[:35], '```', '']
              except Exception as exc:
                  report += [f'- Page source error: `{exc}`', '']

          with open('/tmp/full-catalog-probe.md', 'w', encoding='utf-8') as file:
              file.write('\n'.join(report)[:64000])
          PY
          python /tmp/probe.py

      - name: Publish report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/full-catalog-probe.md', 'utf8');
            const title = 'Full catalog source probe';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
