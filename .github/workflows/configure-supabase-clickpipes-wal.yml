# Triggered after SUPABASE_ACCESS_TOKEN was configured
name: Configure Supabase ClickPipes CDC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-supabase-clickpipes-wal.yml

permissions:
  contents: read

jobs:
  configure-clickpipes-source:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: yfpixszkiakwzrqdcfbw

    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Show CLI version
        run: supabase --version

      - name: Configure WAL retention for ClickPipes CDC
        run: |
          supabase --experimental \
            --project-ref "$SUPABASE_PROJECT_REF" \
            postgres-config update \
            --config max_slot_wal_keep_size=100GB

      - name: Apply the Vault-stored password to clickpipes_user
        shell: bash
        run: |
          SQL=$(cat <<'SQL'
          do $$
          declare
            p text;
          begin
            select decrypted_secret
              into p
            from vault.decrypted_secrets
            where name = 'clickpipes_user_password';

            if p is null then
              raise exception 'Vault secret clickpipes_user_password was not found';
            end if;

            execute format('alter role clickpipes_user password %L', p);
          end
          $$;
          SQL
          )

          HTTP_STATUS=$(curl -sS \
            -o /tmp/supabase-sql-response.json \
            -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$SQL" '{query:$query, read_only:false}')")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            cat /tmp/supabase-sql-response.json
            echo "::error::Could not apply the ClickPipes database credential"
            exit 1
          fi

      - name: Show resulting Postgres config overrides
        run: |
          supabase --experimental \
            --project-ref "$SUPABASE_PROJECT_REF" \
            postgres-config get
