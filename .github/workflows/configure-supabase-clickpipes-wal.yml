name: Configure Supabase ClickPipes WAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ops/clickpipes-cdc
    paths:
      - .github/workflows/configure-supabase-clickpipes-wal.yml

permissions:
  contents: read

jobs:
  configure-wal:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: yfpixszkiakwzrqdcfbw

    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Show CLI version
        run: supabase --version

      - name: Configure WAL retention for ClickPipes CDC
        run: |
          supabase --experimental \
            --project-ref "$SUPABASE_PROJECT_REF" \
            postgres-config update \
            --config max_slot_wal_keep_size=100GB
