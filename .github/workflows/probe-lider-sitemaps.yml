name: Probe Lider sitemaps

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[lider-sitemap-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect sitemap hierarchy
        run: |
          cat > /tmp/probe.py <<'PY'
          import gzip, io, re, urllib.request
          from collections import deque
          H={'User-Agent':'Mozilla/5.0 Chrome/126','Accept':'application/xml,text/xml,text/plain,*/*'}
          seeds=['https://super.lider.cl/siteindex.xml','https://super.lider.cl/v/nc/sitemap/sitemap.xml','https://www.lider.cl/statics.xml']
          def get(url):
            q=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(q,timeout=30) as r:
              raw=r.read(25000000)
              if r.headers.get('content-encoding')=='gzip' or url.endswith('.gz'):
                try: raw=gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
                except: pass
              return r.status,r.headers,raw.decode('utf-8','replace'),r.geturl()
          seen=set(); queue=deque((x,0) for x in seeds); rows=[]; products=[]; pages=[]
          while queue and len(seen)<250:
            url,depth=queue.popleft()
            if url in seen or depth>2: continue
            seen.add(url)
            try:
              st,h,b,final=get(url)
              locs=[x.strip().replace('&amp;','&') for x in re.findall(r'<loc>(.*?)</loc>',b,re.I|re.S)]
              rows.append((depth,url,st,h.get('content-type'),len(b),len(locs),b[:500].replace('\n',' ')))
              for loc in locs:
                low=loc.lower()
                if '/ip/' in low: products.append(loc)
                elif '.xml' in low or 'sitemap' in low: queue.append((loc,depth+1))
                else: pages.append(loc)
            except Exception as e:
              rows.append((depth,url,'ERROR','',0,0,str(e)))
          report=['# Lider sitemap probe','',f'- Sitemap documents inspected: **{len(seen)}**',f'- Product URLs (`/ip/`) discovered: **{len(set(products))}**',f'- Other page URLs discovered: **{len(set(pages))}**','', '## Documents','']
          for depth,url,st,ct,size,n,sample in rows:
            report += [f'### depth {depth} `{url}`',f'- status={st} content-type=`{ct}` bytes={size} locs={n}','```',sample,'```','']
          report += ['## Product URL samples','```',*list(dict.fromkeys(products))[:50],'```','']
          open('/tmp/report.md','w').write('\n'.join(report)[:64000])
          PY
          python /tmp/probe.py
      - name: Publish report
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('fs'); const body=fs.readFileSync('/tmp/report.md','utf8'); const title='Lider sitemap probe';
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const old=issues.find(i=>i.title===title&&!i.pull_request);
            if(old) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:old.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
