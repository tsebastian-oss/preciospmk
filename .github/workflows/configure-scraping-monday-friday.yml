name: Configure Monday Friday Scraping

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/scraping-monday-friday.sql
      - .github/workflows/configure-scraping-monday-friday.yml

permissions:
  contents: read

jobs:
  configure-production-schedule:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: yfpixszkiakwzrqdcfbw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Apply Monday Friday scraping schedule
        shell: bash
        run: |
          SQL=$(cat ops/scraping-monday-friday.sql)
          HTTP_STATUS=$(curl -sS \
            -o /tmp/schedule-response.json \
            -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$SQL" '{query:$query, read_only:false}')")

          cat /tmp/schedule-response.json | jq . || cat /tmp/schedule-response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Could not configure Monday/Friday scraping schedule (HTTP ${HTTP_STATUS})"
            exit 1
          fi

      - name: Verify production cron configuration
        shell: bash
        run: |
          VERIFY_SQL=$(cat <<'SQL'
          select jobname, schedule, active
          from cron.job
          where jobname in (
            'daily-catalog-crawl-starter',
            'daily-non-supermarket-crawls',
            'daily-catalog-crawl-window-closer',
            'scraping-pro-dispatcher-every-minute',
            'capacity-aware-scraper-dispatcher'
          )
          order by jobname;
          SQL
          )

          HTTP_STATUS=$(curl -sS \
            -o /tmp/verify-response.json \
            -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$VERIFY_SQL" '{query:$query, read_only:true}')")

          cat /tmp/verify-response.json | jq . || cat /tmp/verify-response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Could not verify production scraping schedule (HTTP ${HTTP_STATUS})"
            exit 1
          fi
